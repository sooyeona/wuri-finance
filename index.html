<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F7FA">
<title>우리의 자산</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#F7F7FA;}
body{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;color:#1A1A2E;font-size:14px;}
:root{
  --bg:#F7F7FA;--surface:#FFFFFF;--card:#FFFFFF;
  --border:#E8E8F0;--border2:#D0D0E0;
  --text:#1A1A2E;--text2:#5A5A7A;--text3:#9A9AB0;
  --a:#E6819A;--al:#E36584;--a-bg:#FFF0F4;
  --b:#6AACD5;--bl:#3F98D0;--b-bg:#EBF4FF;
  --green:#00A878;--green-bg:#E6F7F3;
  --gold:#C97A00;--gold-bg:#FFF3E0;
  --blue:#2E86DE;--blue-bg:#EBF4FF;
  --red:#E84040;--red-bg:#FFF0F0;
  --shadow:0 1px 4px rgba(0,0,0,0.07);
  --shadow2:0 4px 16px rgba(0,0,0,0.10);
}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);max-width:480px;margin:0 auto;position:relative;}
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:var(--shadow);}
.logo{font-weight:800;font-size:17px;letter-spacing:-0.5px;}.logo span{color:var(--a);}
.hdr-right{display:flex;gap:6px;align-items:center;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
.sync-dot.saving{animation:blink 0.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.bottom-nav{background:var(--surface);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -1px 4px rgba(0,0,0,0.05);}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 2px;gap:2px;border:none;background:transparent;color:var(--text3);font-family:inherit;cursor:pointer;font-size:9px;font-weight:600;min-width:0;transition:color .15s;}
.bnav-btn.on{color:var(--a);}
.bnav-btn .ni{font-size:20px;}
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 12px 16px;-webkit-overflow-scrolling:touch;}
.card{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--border);margin-bottom:10px;box-shadow:var(--shadow);}
.ca{background:#F6ECEF;border-color:#EDD5DC;}
.cb{background:#EAF1F8;border-color:#C8DDEF;}
.cgr{background:var(--green-bg);border-color:#B8E8D8;}
.cgo{background:var(--gold-bg);border-color:#F0D090;}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.sv{font-weight:800;font-size:20px;letter-spacing:-0.5px;}
.sl{font-size:10px;color:var(--text3);margin-top:3px;}
.sec{font-size:12px;font-weight:700;color:var(--text);margin-bottom:10px;}
.sh{font-size:9px;font-weight:700;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;padding:8px 0 6px;border-bottom:1px solid var(--border);margin-bottom:8px;}
.pw{height:6px;border-radius:3px;background:var(--border);overflow:hidden;position:relative;margin-top:4px;}
.pf{position:absolute;top:0;left:0;height:100%;border-radius:3px;transition:width .5s ease;}
.tg{display:inline-block;padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700;}
.ltag{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;background:var(--gold-bg);color:var(--gold);font-size:9px;font-weight:700;}
.btn{padding:9px 16px;border-radius:10px;font-size:12px;font-weight:700;border:none;cursor:pointer;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:5px;}
.bta{background:var(--a);color:#fff;}
.btb{background:var(--b);color:#fff;}
.btg{background:var(--surface);color:var(--text2);border:1.5px solid var(--border);}
.btgr{background:var(--green);color:#fff;}
.btsm{padding:3px 9px;border-radius:6px;font-size:10px;font-weight:600;border:none;cursor:pointer;font-family:inherit;}
.btn:active,.btsm:active{transform:scale(0.95);}
.inp{width:100%;background:var(--bg);border:1.5px solid var(--border);color:var(--text);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:14px;outline:none;appearance:none;transition:border-color .15s;}
.inp:focus{border-color:var(--a);background:var(--surface);}
.lbl{font-size:10px;font-weight:700;color:var(--text2);letter-spacing:.04em;margin-bottom:5px;display:block;}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.row:last-child{border-bottom:none;}
/* 분배 행 */
.dist-row{display:flex;align-items:flex-start;justify-content:space-between;padding:12px 13px;border-radius:12px;margin-bottom:7px;border:1.5px solid var(--border);background:var(--surface);box-shadow:var(--shadow);}
.dist-done{background:#F0FBF7;border-color:#A8DCC8;}
.dist-partial{background:#FFFBF0;border-color:#F0D090;}
/* 모달 */
.moverlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-end;justify-content:center;z-index:200;padding-bottom:env(safe-area-inset-bottom);}
.mbox{background:var(--surface);border-radius:22px 22px 0 0;padding:20px 18px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;}
.mhandle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px;}
.cat-btn{padding:9px 10px;border-radius:9px;font-size:11px;font-weight:600;background:var(--bg);color:var(--text2);border:1.5px solid var(--border);cursor:pointer;text-align:left;font-family:inherit;transition:all .15s;}
.stat-mini{background:var(--bg);border-radius:10px;padding:10px 8px;text-align:center;border:1px solid var(--border);}
.stat-mini .val{font-size:13px;font-weight:800;margin-top:3px;}
.stat-mini .lbl2{font-size:8px;color:var(--text3);font-weight:600;}
.flow{display:flex;align-items:center;gap:5px;padding:10px 12px;background:var(--bg);border-radius:10px;border:1px solid var(--border);}
.flow-item{flex:1;text-align:center;}
.flow-arrow{color:var(--text3);font-size:14px;flex-shrink:0;}
.login-screen{display:flex;align-items:center;justify-content:center;height:100%;padding:20px;}
.login-box{background:var(--surface);border-radius:22px;padding:36px 24px;width:100%;max-width:300px;border:1px solid var(--border);text-align:center;box-shadow:var(--shadow2);}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--a);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.month-tabs{display:flex;gap:5px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;}
.month-tabs::-webkit-scrollbar{display:none;}
.mtab{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;}
.mtab.on{background:#EDF3E6;color:#2A5A1A;border-color:#B8D8A0;}
.chart-wrap{position:relative;width:100%;padding:4px 0;}
.bucket-detail{background:var(--bg);border-radius:10px;padding:10px;margin-top:8px;border:1px solid var(--border);}
.btx-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);}
.btx-row:last-child{border-bottom:none;}
.info-box{padding:10px 12px;border-radius:10px;background:#FFF8E1;border:1px solid #FFE082;font-size:11px;color:#8B6000;margin-bottom:10px;line-height:1.6;}
.year-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.year-bar-label{font-size:10px;color:var(--text2);width:28px;flex-shrink:0;font-weight:600;}
.year-bar-track{flex:1;height:8px;border-radius:4px;background:var(--border);overflow:hidden;}
.year-bar-fill{height:100%;border-radius:4px;}
.year-bar-val{font-size:10px;font-weight:700;color:var(--text);width:60px;text-align:right;flex-shrink:0;}
/* 지출탭 섹션 구분 */
.spend-section-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;margin-bottom:7px;font-size:11px;font-weight:700;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const STORAGE_KEY='wuri-finance-data';
const FIREBASE_CONFIG={
  apiKey:"AIzaSyDR52BFNnM7Yd5EFKT-_SHw7f0gczWR-FQ",
  authDomain:"wuri-finance.firebaseapp.com",
  databaseURL:"https://wuri-finance-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"wuri-finance",
  storageBucket:"wuri-finance.firebasestorage.app",
  messagingSenderId:"260229020877",
  appId:"1:260229020877:web:a6f818ea6b39e75225fd84"
};
const USE_FIREBASE=!!(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.databaseURL);

const C={
  a:'#E6819A',al:'#E36584',abg:'#FFF0F4',
  b:'#6AACD5',bl:'#3F98D0',bbg:'#EBF4FF',
  green:'#00A878',greenbg:'#E6F7F3',
  gold:'#C97A00',goldbg:'#FFF3E0',
  blue:'#2E86DE',bluebg:'#EBF4FF',
  red:'#E84040',redbg:'#FFF0F0',
  text:'#1A1A2E',text2:'#5A5A7A',text3:'#9A9AB0',
  border:'#E8E8F0',bg:'#F7F7FA',surface:'#FFFFFF'
};

// ══════════════════════════════════════════
// 버킷 타입 정의
//  biz      : 사업비 (수입에서 선차감)
//  transfer : 이체형 - 이체완료 = 지출 자동반영 (용돈, 고정비)
//  budget   : 예산형 - 이체완료 후 실지출 상세입력 (생활비)
//  save     : 적립형 - 이체완료 후 꺼낼때만 입력 (세금,비상금,경조사)
// ══════════════════════════════════════════
const BUCKETS=[
  {id:'workshop',  label:'공방 월세',   icon:'🏭',color:'#7C6AF7',desc:'매월 고정 임대료',               type:'transfer',
   items:[{id:'biz_rent',label:'공방 월세',icon:'🏭'}]},
  {id:'biz',      label:'사업 변동비', icon:'⚗️',color:C.red,   desc:'재료비·소모품 (월별 변동, 수시 입력)',type:'biz',
   items:[{id:'biz_material',label:'재료비/은 구매',icon:'⚗️'},{id:'biz_misc',label:'소모품/택배/기타',icon:'📦'}]},
  {id:'tax',      label:'세금 적립',  icon:'📑',color:C.gold,  desc:'종합소득세·부가세 대비',        type:'save',
   items:[{id:'tax_income',label:'종합소득세 적립',icon:'📑'},{id:'tax_extra',label:'추가 세금 안전금',icon:'🛡️'}]},
  {id:'housing',  label:'주거 고정비',icon:'🏠',color:'#7C6AF7',desc:'집월세·관리비·공과금·통신',  type:'transfer',
   items:[{id:'hou_rent',label:'집 월세',icon:'🏠'},{id:'hou_mgmt',label:'관리비',icon:'🔧'},{id:'hou_util',label:'전기/가스/수도',icon:'💡'},{id:'hou_net',label:'인터넷/통신',icon:'📡'}]},
  {id:'living',   label:'생활비',     icon:'🛒',color:C.blue,  desc:'식비·배달·쿠팡·교통',          type:'budget',
   items:[{id:'liv_food',label:'식비/장보기',icon:'🥬'},{id:'liv_delivery',label:'배달/외식',icon:'🍱'},{id:'liv_shop',label:'쿠팡/생필품',icon:'📦'},{id:'liv_cafe',label:'편의점/카페',icon:'☕'},{id:'liv_trans',label:'교통비',icon:'🚇'}]},
  {id:'insurance',label:'보험/의료',  icon:'🛡️',color:'#8B5CF6',desc:'보험료·병원/약국',             type:'transfer',
   items:[{id:'ins_fee',label:'보험료',icon:'🛡️'},{id:'ins_med',label:'병원/약국',icon:'🏥'}]},
  {id:'allowance',label:'개인 용돈',  icon:'💸',color:C.a,     desc:'김수연·신동현 각자 용돈',       type:'transfer',
   items:[{id:'all_a',label:'김수연 용돈',icon:'💜'},{id:'all_b',label:'신동현 용돈',icon:'❤️'}]},
  {id:'event',    label:'경조사/가족',icon:'🎁',color:C.gold,  desc:'경조사·부모님/명절',            type:'save',
   items:[{id:'evt_condolence',label:'경조사',icon:'🎁'},{id:'evt_family',label:'부모님/가족행사',icon:'👨‍👩‍👧'}]},
  {id:'emergency',label:'비상금',     icon:'🆘',color:C.green, desc:'비상금·비수기 대비',            type:'save',
   items:[{id:'emg_main',label:'비상금 적립',icon:'🆘'},{id:'emg_offseason',label:'비수기 대비',icon:'❄️'}]},
];
const ALL_B=BUCKETS.flatMap(b=>b.items.map(i=>({...i,bucketId:b.id,bucketLabel:b.label,bucketColor:b.color,bucketType:b.type})));
const CATS_A=[
  {id:'sav',label:'저축',icon:'🏦',color:C.a},{id:'stk',label:'주식',icon:'📈',color:C.green},
  {id:'etf',label:'펀드/ETF',icon:'💹',color:'#059669'},{id:'coin',label:'코인',icon:'₿',color:C.gold},
  {id:'real',label:'부동산/기타',icon:'🏢',color:C.blue},{id:'pension',label:'연금/IRP',icon:'🧓',color:'#8B5CF6'},
  {id:'etc_a',label:'기타',icon:'📦',color:C.text3}
];

const fmt=n=>'₩'+Math.round(Number(n||0)).toLocaleString('ko-KR');
const fmtS=n=>{const v=Math.round(Number(n||0));if(v>=100000000)return(v/100000000).toFixed(1)+'억';if(v>=10000000)return(v/10000000).toFixed(0)+'천만';if(v>=1000000)return(v/1000000).toFixed(0)+'백만';if(v>=10000)return(v/10000).toFixed(0)+'만';return v.toLocaleString();};
const fmtD=d=>{if(!d)return'';const dt=new Date(d);return`${dt.getMonth()+1}/${dt.getDate()}`;};
const tod=()=>new Date().toISOString().split('T')[0];
const tMonth=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;};
const tYear=()=>String(new Date().getFullYear());

// 25일 기준 분배 주기: 해당 월의 25일
const distDay=m=>`${m}-25`;
// 이번 달 분배일까지 남은 날
const daysToDistDay=()=>{
  const today=new Date();
  const dd=new Date(`${tMonth()}-25`);
  const diff=Math.ceil((dd-today)/(1000*60*60*24));
  return diff;
};

const DEF_DATA={incomes:[],expenses:[],goals:[],settings:{
  nameA:'김수연',nameB:'신동현',avgIncomeB:8000000,minIncomeB:6000000,maxIncomeB:10000000,
  bucketTargets:{biz_rent:1000000,biz_material:500000,biz_misc:200000,tax_income:1200000,tax_extra:400000,
    hou_rent:1200000,hou_mgmt:300000,hou_util:150000,hou_net:150000,liv_food:500000,liv_delivery:300000,
    liv_shop:200000,liv_cafe:100000,liv_trans:120000,ins_fee:500000,ins_med:100000,
    all_a:300000,all_b:300000,evt_condolence:200000,evt_family:200000,emg_main:300000,emg_offseason:100000},
  distributed:{},accum:{}}};

let APP={tab:'dashboard',who:null,modal:null,form:{},viewMonth:tMonth(),viewYear:tYear(),
  data:JSON.parse(JSON.stringify(DEF_DATA)),dbRef:null};

function loadLocal(){
  try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){APP.data=JSON.parse(raw);fixData();}}catch(e){}
}
function fixData(){
  const d=APP.data;
  if(!d.incomes)d.incomes=[];if(!d.expenses)d.expenses=[];if(!d.goals)d.goals=[];
  if(!d.settings)d.settings={...JSON.parse(JSON.stringify(DEF_DATA.settings))};
  const s=d.settings;
  if(!s.bucketTargets)s.bucketTargets={...DEF_DATA.settings.bucketTargets};
  if(!s.distributed)s.distributed={};if(!s.accum)s.accum={};
}
function persist(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(APP.data));}catch(e){}
  render();
  if(APP.dbRef){
    const dot=document.querySelector('.sync-dot');
    if(dot)dot.classList.add('saving');
    APP.dbRef.set(APP.data).then(()=>{if(dot)dot.classList.remove('saving');}).catch(()=>{if(dot)dot.classList.remove('saving');});
  }
}
function initFirebase(){
  if(!USE_FIREBASE)return;
  import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js').then(({initializeApp})=>{
    import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js').then(({getDatabase,ref,onValue,set})=>{
      const fbApp=initializeApp(FIREBASE_CONFIG);
      const db=getDatabase(fbApp);
      APP.dbRef={set:(data)=>set(ref(db,'wuri-finance'),data)};
      onValue(ref(db,'wuri-finance'),snap=>{
        const val=snap.val();
        if(val){APP.data=val;fixData();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(APP.data));}catch(e){}render();}
      });
    });
  }).catch(()=>{});
}

// ── 헬퍼 ──
const nm=id=>id==='A'?(APP.data.settings.nameA||'김수연'):(APP.data.settings.nameB||'신동현');
const tgt=id=>Number(APP.data.settings.bucketTargets?.[id]||0);
const bTgt=bid=>BUCKETS.find(b=>b.id===bid)?.items.reduce((s,i)=>s+tgt(i.id),0)||0;
const vm=()=>APP.viewMonth;
const isDist=bid=>!!(APP.data.settings.distributed||{})[vm()+'_'+bid];

// 수입 / 사업비 / 가처분
const mInc=m=>(APP.data.incomes||[]).filter(i=>i.user==='B'&&i.date?.startsWith(m)).reduce((s,i)=>s+Number(i.amount||0),0);
const BIZ_BUCKET=()=>BUCKETS.find(b=>b.id==='biz');
const mBiz=m=>(APP.data.expenses||[]).filter(e=>e.user==='B'&&e.date?.startsWith(m)&&BIZ_BUCKET()?.items.find(i=>i.id===e.category)).reduce((s,e)=>s+Number(e.amount||0),0);
const mDisp=m=>Math.max(0,mInc(m)-mBiz(m));

// 이체완료된 버킷의 계획금액 합계 (transfer+budget+save, biz 제외)
const mTransferred=m=>BUCKETS.filter(b=>b.id!=='biz'&&isDist(b.id)).reduce((s,b)=>s+bTgt(b.id),0);

// 이체 후 잔액 (가처분 - 이체완료 합계)
const mAfterDist=m=>mDisp(m)-mTransferred(m);

// 실제 지출 (expenses에 기록된 것, biz 제외)
const itemAct=(id,m)=>(APP.data.expenses||[]).filter(e=>e.category===id&&e.date?.startsWith(m)&&!BIZ_BUCKET()?.items.find(i=>i.id===e.category)).reduce((s,e)=>s+Number(e.amount||0),0);
const bAct=(bid,m)=>BUCKETS.find(b=>b.id===bid)?.items.reduce((s,i)=>s+itemAct(i.id,m),0)||0;

// transfer형: 이체완료 = 계획금액 전체가 지출된 것으로 간주
// budget형: 이체완료 + 실지출 상세 추적
// save형: 이체완료 = 적립. 실제 사용은 별도
const getBucketSpent=(b,m)=>{
  if(b.type==='transfer'||b.type==='biz') return isDist(b.id)?bTgt(b.id):bAct(b.id,m);
  return bAct(b.id,m);
};

function getMonths(){
  const s=new Set([tMonth()]);
  (APP.data.incomes||[]).forEach(i=>{if(i.date)s.add(i.date.slice(0,7));});
  (APP.data.expenses||[]).forEach(e=>{if(e.date)s.add(e.date.slice(0,7));});
  return Array.from(s).sort().reverse();
}
function getYears(){

  (APP.data.expenses||[]).forEach(e=>{if(e.date)s.add(e.date.slice(0,4));});

}

        ${b.type==='transfer'?`<div style="font-size:10px;color:${done?C.green:C.text3};">${done?'✅ 이체완료 → 지출 자동반영됨':'이체 후 완료 버튼을 눌러주세요'}</div>`:''}

function rStats(){
  const year=APP.viewYear,years=getYears();
  const mos=['01','02','03','04','05','06','07','08','09','10','11','12'];
  const md=mos.map(mo=>{
    const ym=`${year}-${mo}`;
    const ib=mInc(ym),biz=mBiz(ym),disp=mDisp(ym);
    const sb=(APP.data.expenses||[]).filter(e=>e.user==='B'&&e.date?.startsWith(ym)&&!BIZ_BUCKET()?.items.find(i=>i.id===e.category)).reduce((s,e)=>s+Number(e.amount||0),0);
    // transfer형 이체완료 포함
    const sbTransfer=BUCKETS.filter(b=>b.type==='transfer').reduce((s,b)=>{
      const done=!!(APP.data.settings.distributed||{})[ym+'_'+b.id];
      return s+(done?bTgt(b.id):0);
    },0);
    const ia=(APP.data.incomes||[]).filter(i=>i.user==='A'&&i.date?.startsWith(ym)).reduce((s,i)=>s+Number(i.amount||0),0);
    return{ym,mo:Number(mo),ib,biz,disp,sb:sb+sbTransfer,ia,save:disp-(sb+sbTransfer)};
  });
  const hasData=md.some(d=>d.ib>0||d.ia>0);
  const yTIB=md.reduce((s,d)=>s+d.ib,0),yTIA=md.reduce((s,d)=>s+d.ia,0);
  const yTSB=md.reduce((s,d)=>s+d.sb,0),yTBiz=md.reduce((s,d)=>s+d.biz,0);
  const avgB=hasData?Math.round(yTIB/(md.filter(d=>d.ib>0).length||1)):0;
  const catSpend={};
  (APP.data.expenses||[]).filter(e=>e.user==='B'&&e.date?.startsWith(year)&&!BIZ_BUCKET()?.items.find(i=>i.id===e.category)).forEach(e=>{catSpend[e.category]=(catSpend[e.category]||0)+Number(e.amount||0);});
  return`

  </div>
  ${!hasData?`<div class="card" style="text-align:center;padding:32px 16px;">
    <div style="font-size:28px;margin-bottom:8px;">📊</div>
    <div style="font-size:13px;font-weight:700;margin-bottom:4px;">${year}년 데이터가 없어요</div>
    <div style="font-size:11px;color:var(--text3);">수입·지출을 입력하면 통계가 나타나요</div>
  </div>`:`
  <div class="card cgo">
    <div style="font-size:11px;font-weight:700;margin-bottom:10px;">${year}년 연간 요약</div>
    <div class="g2" style="margin-bottom:6px;">
      <div class="stat-mini"><div class="lbl2">B 연 수입</div><div class="val" style="color:#2E6EA0;">${fmtS(yTIB)}</div></div>
      <div class="stat-mini"><div class="lbl2">A 저축/투자</div><div class="val" style="color:#B05070;">${fmtS(yTIA)}</div></div>
      <div class="stat-mini"><div class="lbl2">연 사업비</div><div class="val" style="color:${C.red};">${fmtS(yTBiz)}</div></div>
      <div class="stat-mini" style="background:var(--green-bg);border-color:#B8E8D8;"><div class="lbl2">B 연 생활비</div><div class="val" style="color:var(--green);">${fmtS(yTSB)}</div></div>
    </div>
    <div style="font-size:10px;color:var(--text2);padding-top:6px;border-top:1px solid var(--border);">B 월평균 수입 <b style="color:#2E6EA0;">${fmt(avgB)}</b></div>
  </div>
  <div class="card"><div style="font-size:11px;font-weight:700;margin-bottom:8px;">📅 월별 수입</div><div class="chart-wrap"><canvas id="ch-inc" height="150"></canvas></div></div>
  <div class="card"><div style="font-size:11px;font-weight:700;margin-bottom:8px;">💸 가처분 vs 지출</div><div class="chart-wrap"><canvas id="ch-exp" height="150"></canvas></div></div>
  ${Object.keys(catSpend).length>0?`<div class="card"><div style="font-size:11px;font-weight:700;margin-bottom:8px;">🏷️ 카테고리별 지출</div><div class="chart-wrap"><canvas id="ch-cat" height="190"></canvas></div></div>`:''}
  <div class="card">
    <div style="font-size:11px;font-weight:700;margin-bottom:10px;">월별 상세</div>
    ${md.filter(d=>d.ib>0).map(d=>{const max=Math.max(...md.map(x=>x.ib),1);return`<div class="year-bar">
      <div class="year-bar-label">${d.mo}월</div>

      <div style="font-size:8px;color:var(--text3);margin-top:1px;">지출 ${fmtS(d.sb)} · 절약 <span style="color:${d.save>=0?C.green:C.red};">${fmtS(d.save)}</span></div></div>
      <div class="year-bar-val" style="color:#2E6EA0;">${fmtS(d.ib)}</div>
    </div>`;}).join('')||`<div style="text-align:center;padding:12px;color:var(--text3);font-size:11px;">데이터 없음</div>`}
  </div>`}`;
}
function drawCharts(){
  if(APP.tab!=='stats')return;
  const year=APP.viewYear,mos=['01','02','03','04','05','06','07','08','09','10','11','12'];
  const labels=mos.map(m=>m+'월');
  const md=mos.map(mo=>{
    const ym=`${year}-${mo}`;
    const disp=mDisp(ym);
    const sb=(APP.data.expenses||[]).filter(e=>e.user==='B'&&e.date?.startsWith(ym)&&!BIZ_BUCKET()?.items.find(i=>i.id===e.category)).reduce((s,e)=>s+Number(e.amount||0),0);
    const sbT=BUCKETS.filter(b=>b.type==='transfer').reduce((s,b)=>{const done=!!(APP.data.settings.distributed||{})[ym+'_'+b.id];return s+(done?bTgt(b.id):0);},0);
    return{ib:mInc(ym),disp,sb:sb+sbT,ia:(APP.data.incomes||[]).filter(i=>i.user==='A'&&i.date?.startsWith(ym)).reduce((s,i)=>s+Number(i.amount||0),0)};
  });
  const catSpend={};
  (APP.data.expenses||[]).filter(e=>e.user==='B'&&e.date?.startsWith(year)&&!BIZ_BUCKET()?.items.find(i=>i.id===e.category)).forEach(e=>{catSpend[e.category]=(catSpend[e.category]||0)+Number(e.amount||0);});
  const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:10},color:'#5A5A7A'},position:'bottom'},tooltip:{callbacks:{label:c=>' '+fmt(c.raw)}}},scales:{x:{ticks:{font:{size:9},color:'#9A9AB0'},grid:{display:false}},y:{ticks:{font:{size:9},color:'#9A9AB0',callback:v=>fmtS(v)},grid:{color:'#E8E8F0'}}}};
  const e1=document.getElementById('ch-inc');
  if(e1)chartInst.inc=new Chart(e1,{type:'bar',data:{labels,datasets:[{label:'B 수입',data:md.map(d=>d.ib),backgroundColor:'#6AACD544',borderColor:'#6AACD5',borderWidth:2,borderRadius:4},{label:'A 저축',data:md.map(d=>d.ia),backgroundColor:'#E6819A44',borderColor:'#E6819A',borderWidth:2,borderRadius:4}]},options:opts});
  const e2=document.getElementById('ch-exp');
  if(e2)chartInst.exp=new Chart(e2,{type:'line',data:{labels,datasets:[{label:'가처분',data:md.map(d=>d.disp),borderColor:C.green,backgroundColor:C.green+'22',fill:true,tension:.3,pointRadius:3,borderWidth:2},{label:'지출',data:md.map(d=>d.sb),borderColor:C.red,backgroundColor:C.red+'22',fill:true,tension:.3,pointRadius:3,borderWidth:2}]},options:opts});
  const e3=document.getElementById('ch-cat');
  if(e3&&Object.keys(catSpend).length){
    const sorted=Object.entries(catSpend).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const allC=[...ALL_B,...CATS_A];
    chartInst.cat=new Chart(e3,{type:'doughnut',data:{labels:sorted.map(([id])=>allC.find(c=>c.id===id)?.label||id),datasets:[{data:sorted.map(([,v])=>v),backgroundColor:['#6AACD5','#E6819A',C.gold,C.green,C.blue,'#8B5CF6','#EC4899','#059669'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:9},color:'#5A5A7A',boxWidth:12}},tooltip:{callbacks:{label:c=>' '+fmt(c.raw)}}}}});
  }
}

            ${b.items.map(i=>`<button class="cat-btn" style="${f.category===i.id?`background:${b.color}18;border-color:${b.color};color:${b.color};font-weight:700;`:''}" onclick="setF('category','${i.id}')">${i.icon} ${i.label}</button>`).join('')}
          </div>`).join(''):
          `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:4px;">${CATS_A.map(c=>`<button class="cat-btn" style="${f.category===c.id?`background:${c.color}18;border-color:${c.color};color:${c.color};font-weight:700;`:''}" onclick="setF('category','${c.id}')">${c.icon} ${c.label}</button>`).join('')}</div>`}
      </div>
      <div style="margin-bottom:10px;"><label class="lbl">금액</label><input class="inp" type="number" placeholder="50,000" id="f-amt" inputmode="numeric"></div>
      <div style="margin-bottom:10px;"><label class="lbl">날짜</label><input class="inp" type="date" id="f-date" value="${tod()}"></div>
      <div style="margin-bottom:14px;"><label class="lbl">메모</label><input class="inp" placeholder="상세 내용" id="f-note"></div>
      <div style="display:flex;gap:8px;padding-bottom:10px;">
        <button class="btn bt${APP.who.toLowerCase()}" style="flex:1;padding:13px;" onclick="submitExp()">저장</button>
        <button class="btn btg" style="flex:1;padding:13px;" onclick="closeModal()">취소</button>
      </div>
    </div>`;
  }

  if(m==='confirm_reset') return`<div class="mbox">
    <div class="mhandle"></div>
    <div style="text-align:center;padding:10px 0 6px;">
      <div style="font-size:40px;margin-bottom:12px;">🗑️</div>
      <div style="font-size:16px;font-weight:800;margin-bottom:8px;color:var(--red);">전체 데이터 초기화</div>
      <div style="font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:6px;">
        수입, 지출, 목표, 분배완료 기록이<br>
        <b style="color:var(--red);">모두 삭제</b>됩니다.
      </div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:20px;">설정값(이름, 목표금액, 분배계획)은 유지돼요</div>
      <div style="background:#FFF0F0;border-radius:10px;padding:12px;border:1px solid #FFCCCC;margin-bottom:20px;">
        <div style="font-size:11px;color:var(--red);font-weight:600;">정말 삭제하시겠어요?</div>
        <div style="font-size:10px;color:var(--text3);margin-top:3px;">이 작업은 되돌릴 수 없어요</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;padding-bottom:10px;">
      <button class="btn" style="flex:1;padding:13px;background:var(--red);color:#fff;" onclick="resetAllData()">삭제할게요</button>
      <button class="btn btg" style="flex:2;padding:13px;" onclick="closeModal()">취소 (데이터 유지)</button>
    </div>
  </div>\`;

  if(m==='goal') return\`<div class="mbox">
    <div class="mhandle"></div>
    <div style="font-size:15px;font-weight:800;margin-bottom:14px;">🎯 목표 추가</div>
    <div style="margin-bottom:10px;"><label class="lbl">목표 이름</label><input class="inp" placeholder="내집마련, 해외여행 등" id="g-title" value="${f.title||''}"></div>
    <div style="margin-bottom:10px;"><label class="lbl">목표 금액</label><input class="inp" type="number" id="g-target" inputmode="numeric"></div>
    <div style="margin-bottom:10px;"><label class="lbl">현재 금액</label><input class="inp" type="number" id="g-cur" inputmode="numeric"></div>
    <div style="margin-bottom:12px;"><label class="lbl">목표 날짜</label><input class="inp" type="date" id="g-dl"></div>
    <div style="margin-bottom:16px;"><label class="lbl">색상</label>
      <div style="display:flex;gap:10px;padding:4px 0;">${[C.a,C.b,C.green,C.gold,C.blue].map(pc=>`<button onclick="setF('color','${pc}')" style="width:30px;height:30px;border-radius:50%;background:${pc};border:${(f.color||C.a)===pc?'3px solid #1A1A2E':'2px solid transparent'};cursor:pointer;"></button>`).join('')}</div>
    </div>
    <div style="display:flex;gap:8px;padding-bottom:10px;">
      <button class="btn bta" style="flex:1;padding:13px;" onclick="submitGoal()">추가</button>
      <button class="btn btg" style="flex:1;padding:13px;" onclick="closeModal()">취소</button>
    </div>
  </div>`;
  return'';
}

// ── 핸들러 ──
window.selectWho=u=>{APP.who=u;render();};
window.logout=()=>{APP.who=null;render();};
window.go=t=>{destroyCharts();APP.tab=t;APP.modal=null;render();};
window.openModal=(m,x)=>{APP.modal=m;APP.form={color:C.a,bucketId:x||null};renderModal();};
window.closeModal=()=>{APP.modal=null;const s=document.getElementById('mslot');if(s)s.innerHTML='';};
window.setF=(k,v)=>{APP.form[k]=v;renderModal();};
window.presetGoal=t=>{APP.modal='goal';APP.form={title:t,color:C.a};renderModal();};
window.setVM=m=>{APP.viewMonth=m;render();};
window.setVY=y=>{APP.viewYear=y;render();};

window.toggleDist=bid=>{
  const key=APP.viewMonth+'_'+bid;
  if(!APP.data.settings.distributed)APP.data.settings.distributed={};
  if(APP.data.settings.distributed[key])delete APP.data.settings.distributed[key];
  else APP.data.settings.distributed[key]=true;
  persist();
};
window.saveSettings=()=>{
  const ss=APP.data.settings;
  ss.nameA=document.getElementById('s-nA')?.value||'김수연';
  ss.nameB=document.getElementById('s-nB')?.value||'신동현';
  ss.avgIncomeB=Number(document.getElementById('s-avg')?.value||0);
  ss.minIncomeB=Number(document.getElementById('s-min')?.value||0);
  ss.maxIncomeB=Number(document.getElementById('s-max')?.value||0);
  if(!ss.bucketTargets)ss.bucketTargets={};
  BUCKETS.flatMap(b=>b.items).forEach(i=>{const el=document.getElementById('bt-'+i.id);if(el&&el.value!=='')ss.bucketTargets[i.id]=Number(el.value);});
  APP.modal=null;persist();
};
window.submitInc=()=>{
  const amt=document.getElementById('f-amt')?.value;if(!amt)return;
  APP.data.incomes.push({id:Date.now(),user:APP.who,amount:Number(amt),date:document.getElementById('f-date')?.value||tod(),source:document.getElementById('f-src')?.value||'',note:document.getElementById('f-note')?.value||'',isRecurring:document.getElementById('f-rec')?.checked||false});
  APP.modal=null;persist();
};
window.submitBiz=()=>{
  const amt=document.getElementById('f-amt')?.value;if(!amt||!APP.form.category)return;
  const ci=ALL_B.find(c=>c.id===APP.form.category)||{};
  APP.data.expenses.push({id:Date.now(),user:'B',amount:Number(amt),category:APP.form.category,label:ci.label||'',date:document.getElementById('f-date')?.value||tod(),note:document.getElementById('f-note')?.value||''});
  APP.modal=null;persist();
};
window.submitExp=()=>{
  const amt=document.getElementById('f-amt')?.value;if(!amt||!APP.form.category)return;
  const cat=[...ALL_B,...CATS_A].find(c=>c.id===APP.form.category)||{};
  APP.data.expenses.push({id:Date.now(),user:APP.who,amount:Number(amt),category:APP.form.category,label:cat.label||'',date:document.getElementById('f-date')?.value||tod(),note:document.getElementById('f-note')?.value||''});
  APP.modal=null;persist();
};
window.submitGoal=()=>{
  const title=document.getElementById('g-title')?.value,target=document.getElementById('g-target')?.value;if(!title||!target)return;
  APP.data.goals.push({id:Date.now(),title,target:Number(target),current:Number(document.getElementById('g-cur')?.value||0),deadline:document.getElementById('g-dl')?.value||'',color:APP.form.color||C.a,owner:APP.who});
  APP.modal=null;persist();
};
window.delInc=id=>{APP.data.incomes=APP.data.incomes.filter(i=>i.id!==id);persist();};
window.delExp=id=>{APP.data.expenses=APP.data.expenses.filter(e=>e.id!==id);persist();};
window.delGoal=id=>{APP.data.goals=APP.data.goals.filter(g=>g.id!==id);persist();};
window.updGoal=(id,v)=>{APP.data.goals=APP.data.goals.map(g=>g.id===id?{...g,current:Number(v)}:g);persist();};

window.confirmReset=()=>{
  APP.modal='confirm_reset';
  renderModal();
};
window.resetAllData=()=>{
  APP.data.incomes=[];
  APP.data.expenses=[];
  APP.data.goals=[];
  APP.data.settings.distributed={};
  APP.data.settings.accum={};
  APP.modal=null;
  persist();
};

loadLocal();
render();
initFirebase();
</script>
</body>
</html>
